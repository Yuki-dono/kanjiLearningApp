# Netlify serves the static site only.
#
# It cannot run the API: Netlify Functions are Node/TypeScript, and this backend
# is Python. The API needs its own host that runs Python — see render.yaml, or
# Railway / Fly.io / any VPS. Until then, account and sync will not work, because
# there is no /api/* on this origin.

[build]
  publish = "."

# The dictionaries are 3.8MB and only change on a redeploy, so cache them hard.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Code must revalidate, or a deploy won't reach anyone holding a warm cache.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/api.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The backend source has no business being served from the site. Harmless today
# (it matches the public repo) but this keeps an accidentally committed
# server/.env from being published.
[[redirects]]
  from = "/server/*"
  to = "/index.html"
  status = 404